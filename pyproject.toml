[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "nb-clean"
dynamic = ["version"]
description = "Clean Jupyter notebooks for versioning"
authors = [{ name = "Scott Stevenson", email = "scott@stevenson.io" }]
readme = "README.md"
license = "ISC"
license-files = ["LICENSE"]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/srstevenson/nb-clean"
Repository = "https://github.com/srstevenson/nb-clean"
Issues = "https://github.com/srstevenson/nb-clean/issues"

[tool.maturin]
bindings = "bin"
locked = true
strip = true

[tool.ruff.lint]
select = ["ALL"]
# These docstring rules conflict with D211 and D212.
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# This is a standalone test script, with assertions rather than a package API.
"tests/test_wheel.py" = ["INP001", "S101"]

[tool.ty.rules]
all = "error"
