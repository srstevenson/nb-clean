[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "nb-clean"
dynamic = ["version"]
description = "Clean Jupyter notebooks for versioning"
authors = [{ name = "Scott Stevenson", email = "scott@stevenson.io" }]
readme = "README.md"
license = "ISC"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["jupyter", "notebook", "clean", "filter", "git"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
]

[project.urls]
Homepage = "https://github.com/srstevenson/nb-clean"
Repository = "https://github.com/srstevenson/nb-clean"
Issues = "https://github.com/srstevenson/nb-clean/issues"

[tool.maturin]
bindings = "bin"
locked = true
strip = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203", # Blank line before class docstring (conflicts with D211)
  "D213", # Multi-line docstring summary on second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/test_wheel.py" = [
  "INP001", # Implicit namespace package (standalone test script)
  "S101",   # Use of assert (test assertions)
]

[tool.ty.rules]
all = "error"
