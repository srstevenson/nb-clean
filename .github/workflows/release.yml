name: Prepare release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheels:
    name: Build and verify wheels
    uses: ./.github/workflows/wheels.yml

  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Check tag matches crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nb-clean") | .version')
          test "$GITHUB_REF_NAME" = "v$version"
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Create archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          executable=nb-clean
          if [[ "$TARGET" == *windows* ]]; then
            executable=nb-clean.exe
          fi
          cp "target/$TARGET/release/$executable" dist/
          cp LICENSE dist/
          if [[ "$TARGET" == *windows* ]]; then
            7z a "nb-clean-$GITHUB_REF_NAME-$TARGET.zip" ./dist/*
          else
            tar -czf "nb-clean-$GITHUB_REF_NAME-$TARGET.tar.gz" -C dist "$executable" LICENSE
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: nb-clean-v*.*
          if-no-files-found: error

  draft:
    name: Create draft release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: assets
          merge-multiple: true
      - name: Add checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: assets
        run: |
          sha256sum nb-clean-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes ./*

  pypi:
    name: Publish wheels to PyPI
    needs: [build, wheels, draft]
    if: github.repository == 'srstevenson/nb-clean' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/nb-clean/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Check wheel count
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 5
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
