[package]
name = "nb-clean"
version = "5.0.0"
edition = "2024"
rust-version = "1.85"
description = "Clean Jupyter notebooks for versioning"
license = "ISC"
readme = "README.md"
repository = "https://github.com/srstevenson/nb-clean"
authors = ["Scott Stevenson <scott@stevenson.io>"]
keywords = ["jupyter", "notebook", "clean", "git"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = "1.0"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
tempfile = "3.20"
walkdir = "2.5"

[lints.rust]
unsafe_code = "forbid"
