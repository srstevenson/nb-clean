[package]
name = "nb-clean"
version = "5.0.0"
edition = "2024"
rust-version = "1.85"
description = "Clean Jupyter notebooks for versioning"
license = "ISC"
readme = "README.md"
repository = "https://github.com/srstevenson/nb-clean"
authors = ["Scott Stevenson <scott@stevenson.io>"]
keywords = ["jupyter", "notebook", "clean", "git"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/src/**/*.rs",
  "/tests/**/*.rs",
  "/tests/notebooks/*.ipynb",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
  "/images/nb-clean.png",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# ignore 0.4.30 needs Rust 1.88 but doesn't declare a rust-version.
ignore = ">=0.4, <0.4.30"
rayon = "1"
serde = "1.0"
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"
